# 行人检测配置文件（用于RK3588板端推理）

# 推理引擎配置
engine:
  type: rknn  # 或 onnx（PC测试用）
  model: artifacts/models/best_person_aug_416_norm_int8.rknn
  input_size: [416, 416]

# 类别配置
classes:
  names:
    - person

# 后处理配置
postprocess:
  # 置信度与NMS
  conf_threshold: 0.25
  nms_threshold: 0.45
  max_detections: 100  # 每张图最多保留100个检测框
  
  # 行人检测特定优化
  min_box_size: 20     # 最小框尺寸（像素）
  aspect_ratio_range: [0.3, 5.0]  # 行人长宽比范围

preprocess:
  profile: speed  # speed|balanced|quality
  undistort:
    enable: false
    calibration_file: ""  # OpenCV 标定文件，需包含 camera_matrix / dist_coeffs
  roi:
    enable: false
    mode: normalized  # normalized|pixel
    normalized_xywh: [0.0, 0.0, 1.0, 1.0]
    pixel_xywh: [0, 0, 0, 0]
    clamp: true
    min_size: 8
  gamma:
    enable: false
    value: 1.0
  white_balance:
    enable: false
    clip_percent: 0.0
  denoise:
    enable: false
    method: bilateral
    d: 5
    sigma_color: 35.0
    sigma_space: 35.0

# 输入源配置
source:
  type: gige
  uri: "rtspsrc location=rtsp://192.168.1.10:8554/stream ! rtph264depay ! h264parse ! avdec_h264 ! videoconvert ! appsink"

# 输出配置
output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 64        # 本地发送队列深度
    bind_ip: "192.168.137.56"
    bind_interface: "eth1"

runtime:
  warmup: 5
  async: false

# 日志配置
logging:
  level: info  # debug / info / warn / error
