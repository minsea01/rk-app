# RK3588 工业相机链路兼容配置
# 当前仓库未部署 industrial_15cls_rk3588_w8a8.rknn；为避免演示误跑缺失模型，
# 该配置默认使用已验证的 person 416 INT8 RKNN 模型。

source:
  type: gige
  uri: "camera-name=MV-CA020-20GC,width=1920,height=1200,framerate=30/1,format=BGR,pull-timeout-ms=500,max-failures=10"

engine:
  type: rknn  # 使用NPU加速的RKNN模型
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]

postprocess:
  conf_threshold: 0.5   # 工业检测较高阈值
  nms_threshold: 0.4
  max_detections: 100

# 使用现有的双网口配置
camera_interface:
  device: eth0        # 工业相机专用网口
  ip: 192.168.1.10    # 与现有setup_network.sh一致
  netmask: 255.255.255.0
  mtu: 9000           # 巨型帧优化

upload_interface:
  device: eth1        # 结果上传专用网口
  ip: 192.168.137.56
  netmask: 255.255.255.0

# 结果上传服务器配置
servers:
  - ip: 192.168.137.1   # 上位机IP
    port: 9000
    protocol: tcp
    backup: false

# 工业15类检测目标
classes: "config/person_classes.txt"

# 性能监控（RK3588优化）
performance:
  target_fps: 24        # 目标帧率
  npu_cores: 3          # 使用全部NPU核心
  cpu_affinity: [4,5,6,7]  # 绑定A76大核

# 预期性能指标
expected_performance:
  fps: ">=30"
  latency: "<=45ms"
  throughput: ">=900Mbps"
  detection_classes: 1
