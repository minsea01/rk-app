# RK3588 双网口行人检测最终验收配置
# 说明：文件名保留历史 640 口径，但当前默认主线已切到 416 INT8。
# eth0: GigE Vision 相机输入
# eth1: 检测结果上传 / SSH: 192.168.137.56/24
# PC 接收端: 192.168.137.1:9000

source:
  type: gige
  uri: "camera-name=MV-CA020-20GC,width=1920,height=1200,framerate=30/1,format=BGR,pull-timeout-ms=500,max-failures=10"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true

postprocess:
  conf_threshold: 0.40
  nms_threshold: 0.35
  max_detections: 300

tracking:
  enable: true
  match_iou: 0.30
  ema_alpha: 0.65
  confirm_hits: 2
  max_misses: 4
  keep_missing_tracks: true
  missing_conf_decay: 0.08

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.56"
    bind_interface: "eth1"
    include_image: true
    image_quality: 80
    image_interval: 3
    draw_detections: true

logging:
  level: "INFO"

camera_interface:
  device: eth0
  ip: 192.168.1.10
  netmask: 255.255.255.0
  mtu: 9000

upload_interface:
  device: eth1
  ip: 192.168.137.56
  netmask: 255.255.255.0

expected_performance:
  input_size: "416x416"
  fps: ">=30"
  latency_p95: "<=45ms"
  throughput: ">=900Mbps"

classes: "config/person_classes.txt"
