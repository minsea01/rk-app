# RK3588 双网口行人检测最终验收配置
# eth0: GigE Vision 相机输入
# eth1: 检测结果上传

source:
  type: gige
  uri: "camera-name=IndustrialCamera-01,width=1920,height=1080,framerate=30/1,format=BGR"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_int8.rknn"
  input_size: [640, 640]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true

postprocess:
  conf_threshold: 0.50
  nms_threshold: 0.50
  max_detections: 300

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.2.100"
    port: 9000
    queue_size: 32

logging:
  level: "INFO"

camera_interface:
  device: eth0
  ip: 192.168.1.10
  netmask: 255.255.255.0
  mtu: 9000

upload_interface:
  device: eth1
  ip: 192.168.2.10
  netmask: 255.255.255.0

expected_performance:
  input_size: "640x640"
  fps: ">=30"
  latency_p95: "<=45ms"
  throughput: ">=900Mbps"

classes: "config/person_classes.txt"
