# Pipeline integrity test configuration.
# The previous yolo11n_opset12_416.onnx artifact is not shipped in this
# workspace; use the current exported person ONNX model for runnable smoke tests.

# Inference engine configuration
engine:
  type: onnx
  model: artifacts/models/best_person_aug_416_norm.onnx
  input_size: [416, 416]

# Classes configuration
classes:
  names:
    - person

# Postprocessing configuration
postprocess:
  conf_threshold: 0.5
  nms_threshold: 0.45
  max_detections: 100
  min_box_size: 20
  aspect_ratio_range: [0.3, 5.0]

# Input source configuration (use folder with single image)
source:
  type: folder
  uri: "assets"

# Output configuration
output:
  type: tcp
  tcp:
    host: "127.0.0.1"
    port: 9000

runtime:
  warmup: 3
  async: false

# Logging configuration
logging:
  level: info
