# RK3588 COCO80 RKNN verification config
# Use this as the taskbook "more than 10 categories" extension path.

source:
  type: gige
  uri: "width=1920,height=1200,framerate=30/1,format=GRAY8,pull-timeout-ms=1000,max-failures=10"

engine:
  type: rknn
  model: "artifacts/models/yolo11n_coco80_416_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true
  undistort:
    enable: false
    calibration_file: ""
  roi:
    enable: false
  gamma:
    enable: false
  white_balance:
    enable: false
  denoise:
    enable: false

postprocess:
  conf_threshold: 0.45
  nms_threshold: 0.45
  max_detections: 100

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.226"
    bind_interface: "eth0"
    include_image: true
    image_quality: 85
    image_interval: 3
    draw_detections: true

logging:
  level: "INFO"

classes: "config/coco80_names.txt"
