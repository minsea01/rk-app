# ============================================================
# GigE 双网口行人检测验收配置（640x640 固定口径）
# ------------------------------------------------------------
# 任务口径：
#   eth0 连接工业相机 / GigE Vision
#   eth1 上传检测结果
#   模型、后处理参数与 CSI 演示链路保持一致
# ============================================================

source:
  type: gige
  # 默认示例：按相机实际名称、分辨率和像素格式调整。
  # 若相机输出 Bayer，可将 format 改成 BayerRG8/BayerBG8 等原始格式。
  uri: "camera-name=IndustrialCamera-01,width=1920,height=1080,framerate=30/1,format=BGR"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_int8.rknn"
  input_size: [640, 640]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true
  undistort:
    enable: false
    calibration_file: ""
  roi:
    enable: false
  gamma:
    enable: false
  white_balance:
    enable: false
  denoise:
    enable: false

postprocess:
  conf_threshold: 0.50
  nms_threshold: 0.50
  max_detections: 300

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.2.100"
    port: 9000
    queue_size: 32

logging:
  level: "INFO"

classes: "config/person_classes.txt"
