# ============================================================
# GigE 双网口行人检测验收配置（416 INT8 主线）
# ------------------------------------------------------------
# 任务口径：
#   eth1 连接工业相机 / GigE Vision
#   eth0 上传检测结果 / SSH: 192.168.137.226/24
#   PC 接收端: 192.168.137.1:9000
#   模型、后处理参数与 CSI 演示链路保持一致
# ============================================================

source:
  type: gige
  # Hikrobot MV-CA020-20GC: native 1920x1200.
  # 当前默认自动选择第一台 Aravis 相机，格式使用板端实测可工作的 GRAY8。
  uri: "width=1920,height=1200,framerate=30/1,format=GRAY8,pull-timeout-ms=1000,max-failures=10"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true
  undistort:
    enable: false
    calibration_file: ""
  roi:
    enable: false
  gamma:
    enable: false
  white_balance:
    enable: false
  denoise:
    enable: false

postprocess:
  conf_threshold: 0.40
  nms_threshold: 0.35
  max_detections: 300

tracking:
  enable: true
  match_iou: 0.30
  ema_alpha: 0.65
  confirm_hits: 2
  max_misses: 4
  keep_missing_tracks: true
  missing_conf_decay: 0.08

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.226"
    bind_interface: "eth0"
    include_image: true
    image_quality: 88
    image_interval: 1
    draw_detections: true
    image_roi:
      enable: false
      mode: normalized
      # Optional far-field digital zoom for live viewing, e.g. [0.20, 0.00, 0.60, 0.70].
      normalized_xywh: [0.0, 0.0, 1.0, 1.0]
      pixel_xywh: [0, 0, 0, 0]
      clamp: true
      min_size: 64

logging:
  level: "INFO"

classes: "config/person_classes.txt"
