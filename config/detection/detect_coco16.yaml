source:
  type: folder
  uri: "datasets/coco/images/val"

engine:
  type: onnx
  model: "artifacts/models/yolo11n_416.onnx"
  input_size: [640, 640]

postprocess:
  conf_threshold: 0.25
  nms_threshold: 0.60
  max_detections: 1000

runtime:
  warmup: 5
  async: false

output:
  type: tcp
  tcp:
    host: "127.0.0.1"
    port: 9000

classes: "config/classes_16.txt"
