# ============================================================
# RK3588 默认 RKNN 运行配置（GigE 双网口主线）
# ------------------------------------------------------------
# 默认入口统一指向 GigE Vision 生产链路：
#   eth1 连接工业相机 / GigE Vision
#   eth0 上传检测结果 / SSH: 192.168.137.226/24
#   PC 接收端: 192.168.137.1:9000
# 若现场 Aravis 相机名称或像素格式不同，请修改下方 `source.uri`
# 与 `output.tcp.*`。
# ============================================================

source:
  type: gige
  uri: "width=1920,height=1200,framerate=30/1,format=GRAY8,pull-timeout-ms=1000,max-failures=10"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true
  undistort:
    enable: false
    calibration_file: ""
  roi:
    enable: false
  gamma:
    enable: false
  white_balance:
    enable: false
  denoise:
    enable: false

postprocess:
  conf_threshold: 0.40
  nms_threshold: 0.35
  max_detections: 300

tracking:
  enable: true
  match_iou: 0.30
  ema_alpha: 0.65
  confirm_hits: 2
  max_misses: 4
  keep_missing_tracks: true
  missing_conf_decay: 0.08

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  enable_profiling: true
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.226"
    bind_interface: "eth0"
    include_image: false
    image_quality: 80
    image_interval: 30
    draw_detections: true
    image_roi:
      enable: false
      mode: normalized
      # Optional far-field digital zoom for live viewing, e.g. [0.20, 0.00, 0.60, 0.70].
      normalized_xywh: [0.0, 0.0, 1.0, 1.0]
      pixel_xywh: [0, 0, 0, 0]
      clamp: true
      min_size: 64

logging:
  level: "INFO"

classes: "config/person_classes.txt"
