# ============================================================
# Hikrobot MV-CA020-20GC GigE Vision production config
# ------------------------------------------------------------
# Target topology:
#   eth1: camera network, board IP 192.168.1.10/24
#   eth0: uplink / SSH, board IP 192.168.137.226/24
#   PC receiver: 192.168.137.1:9000
#
# Current board default uses the first discovered Aravis camera and the
# verified GRAY8 stream from the Hikvision MV-CA020-20GC.
# ============================================================

source:
  type: gige
  uri: "width=1920,height=1200,framerate=30/1,format=GRAY8,pull-timeout-ms=1000,max-failures=10"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true
  undistort:
    enable: false
    calibration_file: ""
  roi:
    enable: false
  gamma:
    enable: false
  white_balance:
    enable: false
  denoise:
    enable: false

postprocess:
  conf_threshold: 0.40
  nms_threshold: 0.35
  max_detections: 300

tracking:
  enable: true
  match_iou: 0.30
  ema_alpha: 0.65
  confirm_hits: 2
  max_misses: 4
  keep_missing_tracks: true
  missing_conf_decay: 0.08

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.226"
    bind_interface: "eth0"
    include_image: true
    image_quality: 88
    image_interval: 1
    draw_detections: true
    image_roi:
      enable: false
      mode: normalized
      # Optional far-field digital zoom for live viewing, e.g. [0.20, 0.00, 0.60, 0.70].
      normalized_xywh: [0.0, 0.0, 1.0, 1.0]
      pixel_xywh: [0, 0, 0, 0]
      clamp: true
      min_size: 64

logging:
  level: "INFO"

camera_interface:
  device: eth1
  ip: 192.168.1.10
  netmask: 255.255.255.0
  mtu: 1500

upload_interface:
  device: eth0
  ip: 192.168.137.226
  netmask: 255.255.255.0

expected_camera:
  vendor: Hikrobot
  model: MV-CA020-20GC
  native_resolution: "1920x1200"
  nominal_fps: 30
  preferred_format: GRAY8
  fallback_formats: [BayerRG8, BayerGB8, BayerBG8, BayerGR8, BGR]

classes: "config/person_classes.txt"
