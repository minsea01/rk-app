# ============================================================
# Hikrobot MV-CA020-20GC GigE Vision production config
# ------------------------------------------------------------
# Target topology:
#   eth0: camera network, board IP 192.168.1.10/24
#   eth1: uplink / SSH, board IP 192.168.137.56/24
#   PC receiver: 192.168.137.1:9000
#
# If aravis lists a different camera name, replace camera-name below with
# the exact name from `arv-tool-0.8 list` or run detect_cli with --source.
# If BGR negotiation fails, try format=BayerRG8/BayerGB8 after checking the
# pixel format with Hikrobot MVS.
# ============================================================

source:
  type: gige
  uri: "camera-name=MV-CA020-20GC,width=1920,height=1200,framerate=30/1,format=BGR,pull-timeout-ms=500,max-failures=10"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true
  undistort:
    enable: false
    calibration_file: ""
  roi:
    enable: false
  gamma:
    enable: false
  white_balance:
    enable: false
  denoise:
    enable: false

postprocess:
  conf_threshold: 0.40
  nms_threshold: 0.35
  max_detections: 300

tracking:
  enable: true
  match_iou: 0.30
  ema_alpha: 0.65
  confirm_hits: 2
  max_misses: 4
  keep_missing_tracks: true
  missing_conf_decay: 0.08

runtime:
  warmup: 10
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.56"
    bind_interface: "eth1"
    include_image: true
    image_quality: 80
    image_interval: 3
    draw_detections: true

logging:
  level: "INFO"

camera_interface:
  device: eth0
  ip: 192.168.1.10
  netmask: 255.255.255.0
  mtu: 1500

upload_interface:
  device: eth1
  ip: 192.168.137.56
  netmask: 255.255.255.0

expected_camera:
  vendor: Hikrobot
  model: MV-CA020-20GC
  native_resolution: "1920x1200"
  nominal_fps: 30
  preferred_format: BGR
  fallback_formats: [BayerRG8, BayerGB8, BayerBG8, BayerGR8, Mono8]

classes: "config/person_classes.txt"
