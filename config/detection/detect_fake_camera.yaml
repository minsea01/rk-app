# RK3588 无真实相机验收配置：用预生成视频模拟 30fps 相机输入
#
# 板端生成测试视频（不会提交大文件）：
#   python3 tools/make_fake_camera_video.py --source artifacts/pexels_random15_416 \
#     --output artifacts/fake_camera_416_30fps_60s.avi --fps 30 --frames 1800
#
# 已验证口径：
#   source video -> RKNN NPU -> TCP eth1 -> PC 192.168.137.1:9000
#   1800/1800 frames, 0 drops, avg 28.924 ms, avg 33.96 FPS

source:
  type: video
  uri: "artifacts/fake_camera_416_30fps_60s.avi"

engine:
  type: rknn
  model: "artifacts/models/best_person_aug_416_norm_int8.rknn"
  input_size: [416, 416]
  use_npu_multicore: true
  use_zero_copy: false

preprocess:
  profile: speed
  use_rga_preprocess: true

postprocess:
  conf_threshold: 0.40
  nms_threshold: 0.35
  max_detections: 300

tracking:
  enable: true
  match_iou: 0.30
  ema_alpha: 0.65
  confirm_hits: 2
  max_misses: 4
  keep_missing_tracks: true
  missing_conf_decay: 0.08

runtime:
  warmup: 5
  async: true

output:
  type: tcp
  tcp:
    host: "192.168.137.1"
    port: 9000
    queue_size: 32
    bind_ip: "192.168.137.56"
    bind_interface: "eth1"
    include_image: false
    image_quality: 80
    image_interval: 3
    draw_detections: true

logging:
  level: "INFO"

classes: "config/person_classes.txt"
